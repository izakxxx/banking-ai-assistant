name: CD Banking AI Assistant

on:
  push:
    branches:
      - main
    paths:
      - "banking-ai-assistant/**"
      - "apps/banking-ai-assistant/**"
      - ".github/workflows/cd-banking-ai-assistant.yml"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: izakxxx/banking-ai-assistant
  APP_MANIFEST_PATH: apps/banking-ai-assistant/deployment.yaml

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Update Kubernetes manifest image tag
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.vars.outputs.IMAGE_TAG }}"
          sed -i "s|image: .*banking-ai-assistant:.*|image: ${IMAGE}|g" "${APP_MANIFEST_PATH}"

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add "${APP_MANIFEST_PATH}"
          git commit -m "chore: deploy banking-ai-assistant ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push
