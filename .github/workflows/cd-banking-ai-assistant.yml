name: CD Banking AI Assistant

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/cd-banking-ai-assistant.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: izakxxx/banking-ai-assistant
  GITOPS_REPO: izakxxx/fineract-assistant-platform
  GITOPS_PATH: gitops
  APP_MANIFEST_PATH: apps/banking-ai-assistant/deployment.yaml

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_PATH }}

      - name: Update Kubernetes manifest image tag
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${{ steps.vars.outputs.IMAGE_TAG }}"
          MANIFEST="${GITOPS_PATH}/${APP_MANIFEST_PATH}"

          echo "Updating manifest: ${MANIFEST}"
          echo "New image: ${IMAGE}"

          sed -i "s|image: .*banking-ai-assistant:.*|image: ${IMAGE}|g" "${MANIFEST}"

      - name: Commit updated GitOps manifest
        run: |
          cd "${GITOPS_PATH}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add "${APP_MANIFEST_PATH}"
          git commit -m "chore: deploy banking-ai-assistant ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push
